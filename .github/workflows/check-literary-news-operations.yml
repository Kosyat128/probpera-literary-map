name: Check literary news operations without publishing

on:
  workflow_dispatch:
  schedule:
    - cron: "27,57 * * * *"

permissions:
  contents: read

concurrency:
  group: literary-news-operations-check
  cancel-in-progress: false

jobs:
  status:
    if: github.ref == 'refs/heads/main' && vars.LITERARY_NEWS_NATIVE_DELIVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify the read-only projection and stale checkpoint detection
        run: npx vitest run scripts/check-literary-news-operations.test.mjs
      - name: Read configured schedules and actual Telegram acknowledgement counts
        env:
          LITERARY_NEWS_NATIVE_PREPARATION_ENABLED: ${{ vars.LITERARY_NEWS_NATIVE_PREPARATION_ENABLED }}
          LITERARY_NEWS_NATIVE_PREPARATION_BLOCK_REASON: ${{ vars.LITERARY_NEWS_NATIVE_PREPARATION_BLOCK_REASON }}
          LITERARY_NEWS_NATIVE_PREPARATION_AUTO_RESUME: ${{ vars.LITERARY_NEWS_NATIVE_PREPARATION_AUTO_RESUME }}
          LITERARY_NEWS_NATIVE_PREPARATION_RESUME_AFTER: ${{ vars.LITERARY_NEWS_NATIVE_PREPARATION_RESUME_AFTER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-literary-news-operations.mjs --expect-enabled --expected-head "$GITHUB_SHA" --output .tmp/news-operations/status.json
      - name: Retain only the safe operations counts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: literary-news-operations-status
          path: .tmp/news-operations/status.json
          if-no-files-found: ignore
          retention-days: 14
