name: Audit live production security

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: live-production-security-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout audited release
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Audit direct public origin and keep Cloudflare proxy off
        run: node scripts/audit-public-direct-origin.mjs --attempts=6 --retry-delay-ms=15000

      - name: Audit strict admin HTTPS, headers, and security.txt
        run: npm run release:smoke:live -- --origins=https://admin.probpera.ru --attempts=6 --retry-delay-ms=15000
