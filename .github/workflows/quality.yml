name: Quality and security

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Serial browser coverage can exceed 45 minutes on slower hosted runners.
    # Keep room for the complete suite and failure diagnostics.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Stage 5 baseline tests intentionally read the immutable BASE_MAIN_SHA.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Check types and admin code
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Audit editorial content
        run: npm run content:audit

      - name: Audit article links
        run: npm run links:audit

      - name: Audit encyclopedia and media
        run: npm run countries:audit && npm run media:audit && npm run books:audit && npm run covers:audit && npm run assets:globe:qa

      - name: Build production public site and admin
        run: npm run admin:build && npm run build:domain

      - name: Verify the public literary news Worker bundle
        run: node node_modules/wrangler/bin/wrangler.js deploy --dry-run --config scripts/wrangler.literary-news.jsonc --outdir .tmp/literary-news-worker

      - name: Audit production SEO output
        run: npm run seo:audit

      - name: Enforce production performance budget
        run: npm run performance:audit

      - name: Install browser quality tools
        run: npx playwright install --with-deps chromium

      - name: Run premium globe browser and mobile checks
        env:
          PLAYWRIGHT_SUITE: premium-globe
        run: |
          set -euo pipefail
          for shard in 21 {1..20} 22; do
            echo "::group::Premium globe shard ${shard}/22"
            npm run test:e2e -- --shard="${shard}/22" --workers=1
            echo "::endgroup::"
          done

      - name: Run WebGL-heavy regression checks serially
        env:
          PLAYWRIGHT_SUITE: webgl-regression
        run: npm run test:e2e -- --workers=1

      - name: Run remaining browser, mobile and accessibility checks in parallel
        env:
          PLAYWRIGHT_SUITE: regression
        run: npm run test:e2e

      - name: Upload browser diagnostics on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: browser-quality-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=high
