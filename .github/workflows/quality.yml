name: Quality and security

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch_turnstile_release_config:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/auth-turnstile' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Apply guarded release configuration changes
        run: node scripts/patch-turnstile-release-config.mjs

      - name: Commit the generated non-workflow policy patch when needed
        shell: bash
        run: |
          git add \
            scripts/build-article-pages.mjs \
            scripts/cloudflare/configure-edge-security.mjs
          if git diff --cached --quiet; then
            echo "Turnstile public policy is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(auth): align Turnstile public CSP"
          git push origin HEAD:${{ github.head_ref }}

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Check types and admin code
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Audit editorial content
        run: npm run content:audit

      - name: Audit article links
        run: npm run links:audit

      - name: Audit encyclopedia and media
        run: npm run countries:audit && npm run media:audit && npm run books:audit && npm run covers:audit && npm run assets:globe:qa

      - name: Build production public site and admin
        run: npm run admin:build && npm run build:domain

      - name: Audit production SEO output
        run: npm run seo:audit

      - name: Enforce production performance budget
        run: npm run performance:audit

      - name: Install browser quality tools
        run: npm install --no-save --ignore-scripts @playwright/test@1.60.0 @axe-core/playwright@4.11.3 && npx playwright install --with-deps chromium

      - name: Run browser, mobile and accessibility checks
        run: npm run test:e2e

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-quality-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=high
