name: Quality and security

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Check types and admin code
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Audit editorial content
        run: npm run content:audit

      - name: Audit article links
        run: npm run links:audit

      - name: Audit encyclopedia and media
        run: npm run countries:audit && npm run media:audit && npm run books:audit && npm run covers:audit && npm run assets:globe:qa

      - name: Build production public site and admin
        run: npm run admin:build && npm run build:domain

      - name: Audit production SEO output
        run: npm run seo:audit

      - name: Enforce production performance budget
        run: npm run performance:audit

      - name: Install browser quality tools
        run: npx playwright install --with-deps chromium

      - name: Run browser, mobile and accessibility checks
        run: npm run test:e2e

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-quality-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=high
