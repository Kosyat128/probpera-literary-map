name: Quality and security

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Check types and admin code
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Audit editorial content
        run: npm run content:audit

      - name: Audit article links
        run: npm run links:audit

      - name: Audit encyclopedia and media
        run: npm run countries:audit && npm run media:audit && npm run covers:audit

      - name: Build public site and admin
        run: npm run build:all

      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=high
