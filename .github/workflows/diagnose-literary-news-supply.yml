name: Diagnose literary news supply without publishing

on:
  workflow_dispatch:
  push:
    branches: [codex/repair-news-delivery]
    paths: [.github/workflows/diagnose-literary-news-supply.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Encrypt bounded preparation diagnostics to the operator public key
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {randomBytes,createCipheriv,publicEncrypt,constants} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          const publicKey=Buffer.from('','base64');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN;
          if(!/^[a-f0-9]{32}$/i.test(account||'')||!token)throw Error('credentials_missing');
          const prefix=`https://api.cloudflare.com/client/v4/accounts/${account}/storage/kv/namespaces/f3ae59fd55ee4c0cac8ff1613db81680/values/`;
          const get=async key=>{const r=await fetch(prefix+encodeURIComponent(key),{headers:{Authorization:`Bearer ${token}`},redirect:'error',signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error('report_read_failed_'+r.status);return r.json();};
          const report=await get('literary-news:v1:daily-automation:native-report');
          const fields=['checkedAt','day','status','stoppedReason','providerHttpStatus','newlyAccepted','admittedToday','acceptedHistorical','aiCalls','reservedAiCallsToday','draftRequestsToday','totalSourceDetails','heldCount','publicationConfirmed'];
          const counts=rows=>{const out={};for(const row of rows||[]){const code=/^[a-z0-9_]{1,120}$/.test(row.reason||'')?row.reason:'other';out[code]=(out[code]||0)+1;}return out;};
          const reportSummary={readonly:true,report:Object.fromEntries(fields.map(k=>[k,report[k]])),heldReasons:counts(report.held),deterministicHeld:counts(report.native?.deterministicHeld),sourceCounts:report.native?.sourceCounts};
          const ledger=await get('literary-news:v1:daily-automation:ledger');
          const ledgerSummary={readonly:true,updatedAt:ledger.updatedAt,providerStop:ledger.providerStop,budgets:ledger.inferenceBudgets,accepted:ledger.accepted?.length,cachedReasons:counts(ledger.reviewCache),cachedStatuses:(ledger.reviewCache||[]).reduce((a,r)=>(a[r.status]=(a[r.status]||0)+1,a),{})};
          const key=randomBytes(32),iv=randomBytes(12),cipher=createCipheriv('aes-256-gcm',key,iv);
          const encrypted=Buffer.concat([cipher.update(JSON.stringify({reportSummary,ledgerSummary}),'utf8'),cipher.final()]);
          writeFileSync('diagnostic.encrypted.json',JSON.stringify({encrypted:encrypted.toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),key:publicEncrypt({key:publicKey,padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key).toString('base64')}));
          console.log('Read-only diagnostic encrypted; no operational state printed.');
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: encrypted-news-diagnostic
          path: diagnostic.encrypted.json
          retention-days: 1
          if-no-files-found: error
