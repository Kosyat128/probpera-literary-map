name: One-time reconciliation contract fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - ".github/workflows/fix-premium-reconciliation-contract.yml"

permissions:
  contents: write

concurrency:
  group: one-time-reconciliation-contract-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.number == 88 && github.actor == 'Kosyat128'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout translation branch
        uses: actions/checkout@v7
        with:
          ref: feat/premium-english-autotranslation
          fetch-depth: 1

      - name: Update the exact production verification contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path("scripts/database/production-migration-plan.test.mjs")
          source = path.read_text(encoding="utf-8")
          old = "schema_health=20260822_zz_atomic_article_bundle;outbox=true;outbox_rpc=true;article_bundle_rpc=true;publication_triggers=true;staff_editorial_read_policies=true;revision_history=true;work_translations=true;work_cover_artworks=true;country_overrides=true;writer_overrides=true;homepage_move=true;tags_updated_at=true;migration_ledger=true;ledger_entries=13;invalid_indexes=0"
          new = "schema_health=20260822_zz_atomic_article_bundle;outbox=true;outbox_rpc=true;article_bundle_rpc=true;publication_triggers=true;staff_editorial_read_policies=true;revision_history=true;work_translations=true;work_cover_artworks=true;country_overrides=true;writer_overrides=true;homepage_move=true;tags_updated_at=true;migration_ledger=true;premium_machine_translation=true;ledger_entries=14;invalid_indexes=0"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected one stale contract, found {count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Run the guarded migration-plan tests
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npx vitest run scripts/database/production-migration-plan.test.mjs
          git diff --check

      - name: Commit the corrected test contract
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "probpera-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/database/production-migration-plan.test.mjs
          git commit -m "test(db): expect premium reconciliation contract"
          git push origin HEAD:feat/premium-english-autotranslation
