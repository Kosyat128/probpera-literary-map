name: Refresh literary news sources

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/lib/literary-news-*.mjs"
      - "scripts/refresh-literary-news.mjs"
      - "scripts/sync-literary-news.mjs"
      - "scripts/wrangler.literary-news.jsonc"
      - "data/news/reviewed.json"
      - ".github/workflows/refresh-literary-news.yml"

permissions:
  contents: read

concurrency:
  group: literary-news-source-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the published source registry
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Collect sources and preserve the private editorial queue
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/sync-literary-news.mjs
      - name: Retain source health diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: literary-news-source-health
          path: .tmp/literary-news-sync/source-health.json
          if-no-files-found: ignore
          retention-days: 14
