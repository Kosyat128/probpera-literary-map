name: Patch Turnstile feature branch configuration

on:
  push:
    branches:
      - feat/auth-turnstile

permissions:
  contents: write

concurrency:
  group: patch-turnstile-feature-branch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/auth-turnstile

      - name: Apply guarded release configuration changes
        run: node scripts/patch-turnstile-release-config.mjs

      - name: Commit the generated patch when needed
        shell: bash
        run: |
          git add \
            .github/workflows/deploy-pages.yml \
            scripts/build-article-pages.mjs \
            scripts/cloudflare/configure-edge-security.mjs
          if git diff --cached --quiet; then
            echo "Turnstile release configuration is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(auth): align Turnstile release configuration"
          git push origin HEAD:feat/auth-turnstile
