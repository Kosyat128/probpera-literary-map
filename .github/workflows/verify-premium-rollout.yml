name: Verify premium rollout

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/verify-premium-rollout.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: verify-premium-rollout-20260823
  cancel-in-progress: false

jobs:
  runs-and-live-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: 5950d4f46f632e6290db09e8afe6f78b7b5c7114
    steps:
      - name: Report exact post-merge workflow states
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const token = process.env.GH_TOKEN;
          const repository = process.env.REPOSITORY;
          const targetSha = process.env.TARGET_SHA;
          const response = await fetch(
            `https://api.github.com/repos/${repository}/actions/runs?head_sha=${targetSha}&per_page=100`,
            {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${token}`,
                "X-GitHub-Api-Version": "2022-11-28",
                "User-Agent": "probpera-rollout-verifier",
              },
            }
          );
          if (!response.ok) {
            throw new Error(`GitHub Actions API returned ${response.status}`);
          }
          const data = await response.json();
          const requiredNames = new Set([
            "Deploy Vite site to GitHub Pages",
            "Deploy editorial admin",
            "Dispatch premium database reconciliation",
            "Reconcile production database",
          ]);
          const selected = data.workflow_runs
            .filter(
              (run) =>
                run.head_sha === targetSha && requiredNames.has(run.name)
            )
            .map((run) => ({
              name: run.name,
              id: run.id,
              event: run.event,
              status: run.status,
              conclusion: run.conclusion,
              createdAt: run.created_at,
              updatedAt: run.updated_at,
              url: run.html_url,
            }))
            .sort((left, right) => left.id - right.id);
          console.log("POST_MERGE_RUNS");
          console.log(JSON.stringify(selected, null, 2));

          const releaseResponse = await fetch(
            `https://probpera.ru/.well-known/probpera-release-head.json?target=${targetSha}`,
            { headers: { "Cache-Control": "no-cache" } }
          );
          const releaseText = await releaseResponse.text();
          console.log(
            `LIVE_RELEASE status=${releaseResponse.status} payload=${releaseText.slice(
              0,
              500
            )}`
          );

          const adminResponse = await fetch(
            `https://admin.probpera.ru/health?target=${targetSha}`,
            { redirect: "manual", headers: { "Cache-Control": "no-cache" } }
          );
          console.log(
            `ADMIN_HEALTH status=${adminResponse.status} location=${
              adminResponse.headers.get("location") || ""
            } server=${adminResponse.headers.get("server") || ""}`
          );
          NODE

  production-database-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      TARGET_SHA: 5950d4f46f632e6290db09e8afe6f78b7b5c7114
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
    steps:
      - name: Checkout the merged code plus this read-only verifier
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify production credentials and PostgreSQL client
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SUPABASE_DB_URL"
          test -n "$SUPABASE_URL"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Build the reviewed verification query
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/database/build-production-migration-plan.mjs \
            --output /tmp/unused-plan.sql \
            --manifest /tmp/production-manifest.json \
            --verification /tmp/production-verify.sql \
            --repository-sha "$TARGET_SHA"

      - name: Read the actual production contract without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          psql "$SUPABASE_DB_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --file /tmp/production-verify.sql \
            > /tmp/production-contract.txt
          printf 'ACTUAL_PRODUCTION_CONTRACT='
          tr -d '\r\n' < /tmp/production-contract.txt
          printf '\n'
