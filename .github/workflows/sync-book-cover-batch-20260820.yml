name: Sync book cover batch 2026-08-20

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact lowercase 40-character SHA of the current main tip"
        required: true
        type: string
      confirmation:
        description: "Type exactly: SYNC BOOK COVER BATCH 20260820"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-book-cover-batch-20260820
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production

    steps:
      - name: Checkout the exact approved main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate immutable invocation
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::expected_main_sha must be 40 lowercase hexadecimal characters."
            exit 1
          }
          [[ "$CONFIRMATION" == "SYNC BOOK COVER BATCH 20260820" ]] || {
            echo "::error::The production batch confirmation text is not exact."
            exit 1
          }
          [[ "$GITHUB_SHA" == "$EXPECTED_MAIN_SHA" ]] || {
            echo "::error::The workflow commit does not match expected_main_sha."
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" ]] || {
            echo "::error::The checkout does not match expected_main_sha."
            exit 1
          }

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install the locked dependency graph
        run: npm ci

      - name: Validate production secrets and pinned API identity
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          node scripts/database/verify-book-cover-batch-20260820.mjs
          --validate-environment-only

      - name: Validate the repository batch without database access
        run: node scripts/sync-literary-archive.mjs --batch-2026-08-20

      - name: Run the read-only production schema and data preflight
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          node scripts/sync-literary-archive.mjs --batch-2026-08-20
          --preflight

      - name: Reconfirm remote main and apply the idempotent batch
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -Eeuo pipefail
          current_main_sha="$(git ls-remote --exit-code origin refs/heads/main | awk '{ print $1 }')"
          [[ "$current_main_sha" == "$EXPECTED_MAIN_SHA" ]] || {
            echo "::error::main advanced after approval; start a new reviewed run."
            exit 1
          }
          node scripts/sync-literary-archive.mjs --batch-2026-08-20 --apply

      - name: Verify the exact production batch through the service role
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/database/verify-book-cover-batch-20260820.mjs
