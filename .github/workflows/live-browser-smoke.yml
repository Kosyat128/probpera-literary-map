name: Live public browser smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  workflow_run:
    workflows:
      - Deploy Vite site to GitHub Pages
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: live-public-browser-smoke
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit live public browser flows
        run: node scripts/audit-live-browser.mjs
        env:
          PUBLIC_SITE_URL: https://probpera.ru

      - name: Upload live browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-public-browser-report
          path: reports/live-browser
          if-no-files-found: warn
          retention-days: 14
