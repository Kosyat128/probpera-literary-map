name: Analyze admin Worker bundle

on:
  push:
    branches:
      - fix/admin-worker-bundle-size
    paths:
      - ".github/workflows/analyze-admin-worker-bundle.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/analyze-admin-worker-bundle.yml"

permissions:
  contents: read

concurrency:
  group: analyze-admin-worker-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      YANDEX_METRIKA_COUNTER_ID: ${{ vars.YANDEX_METRIKA_COUNTER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Generate the complete editorial catalog
        run: npm run editorial:catalog

      - name: Build OpenNext Worker
        run: npm run cf:build --workspace @probpera/admin

      - name: Produce the exact Wrangler dry-run bundle and metafile
        shell: bash
        run: |
          set -Eeuo pipefail
          cd apps/admin
          rm -rf .wrangler-dry
          mkdir -p .wrangler-dry
          npx wrangler deploy \
            --dry-run \
            --outdir .wrangler-dry \
            --metafile .wrangler-dry/meta.json \
            --config wrangler.jsonc
          find .wrangler-dry -maxdepth 3 -type f -printf '%s %p\n' \
            | sort -nr \
            | head -n 40

      - name: Summarize bundled inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const directory = path.resolve("apps/admin/.wrangler-dry");
          const metaPath = path.join(directory, "meta.json");
          const meta = JSON.parse(fs.readFileSync(metaPath, "utf8"));

          const totals = new Map();
          const outputs = Object.entries(meta.outputs || {}).map(
            ([name, output]) => {
              for (const [inputName, value] of Object.entries(
                output.inputs || {}
              )) {
                totals.set(
                  inputName,
                  (totals.get(inputName) || 0) +
                    Number(value.bytesInOutput || 0)
                );
              }
              return {
                name,
                bytes: Number(output.bytes || 0),
                inputCount: Object.keys(output.inputs || {}).length,
              };
            }
          );
          outputs.sort((left, right) => right.bytes - left.bytes);

          const rows = [...totals.entries()]
            .map(([name, bytesInOutput]) => ({ name, bytesInOutput }))
            .sort((left, right) => right.bytesInOutput - left.bytesInOutput);
          const summary = {
            outputCount: outputs.length,
            outputBytes: outputs.reduce((sum, output) => sum + output.bytes, 0),
            outputs: outputs.slice(0, 100),
            inputCount: rows.length,
            topInputs: rows.slice(0, 500),
          };
          fs.writeFileSync(
            path.join(directory, "bundle-top-inputs.json"),
            `${JSON.stringify(summary, null, 2)}\n`
          );
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload Worker bundle evidence
        uses: actions/upload-artifact@v7
        with:
          name: admin-worker-bundle-analysis
          path: |
            apps/admin/.wrangler-dry/meta.json
            apps/admin/.wrangler-dry/bundle-top-inputs.json
          retention-days: 7
          if-no-files-found: error
