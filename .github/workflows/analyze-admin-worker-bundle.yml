name: Analyze admin Worker bundle

on:
  push:
    branches:
      - fix/admin-worker-bundle-size
    paths:
      - ".github/workflows/analyze-admin-worker-bundle.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/analyze-admin-worker-bundle.yml"

permissions:
  contents: read

concurrency:
  group: analyze-admin-worker-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      YANDEX_METRIKA_COUNTER_ID: ${{ vars.YANDEX_METRIKA_COUNTER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Generate the complete editorial catalog
        run: npm run editorial:catalog

      - name: Build OpenNext Worker
        run: npm run cf:build --workspace @probpera/admin

      - name: Summarize bundled inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const directory = path.resolve(
            "apps/admin/.open-next/server-functions/default"
          );
          const metaPath = path.join(directory, "handler.mjs.meta.json");
          const meta = JSON.parse(fs.readFileSync(metaPath, "utf8"));
          const handler = Object.entries(meta.outputs || {}).find(([name]) =>
            name.endsWith("handler.mjs")
          );
          if (!handler) throw new Error("OpenNext handler output is absent from metafile");
          const [outputName, output] = handler;
          const rows = Object.entries(output.inputs || {})
            .map(([name, value]) => ({
              name,
              bytesInOutput: Number(value.bytesInOutput || 0),
            }))
            .sort((left, right) => right.bytesInOutput - left.bytesInOutput);
          const summary = {
            outputName,
            outputBytes: Number(output.bytes || 0),
            inputCount: rows.length,
            topInputs: rows.slice(0, 300),
          };
          fs.writeFileSync(
            path.join(directory, "bundle-top-inputs.json"),
            `${JSON.stringify(summary, null, 2)}\n`
          );
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload Worker bundle evidence
        uses: actions/upload-artifact@v7
        with:
          name: admin-worker-bundle-analysis
          path: |
            apps/admin/.open-next/server-functions/default/handler.mjs.meta.json
            apps/admin/.open-next/server-functions/default/bundle-top-inputs.json
          retention-days: 7
          if-no-files-found: error
