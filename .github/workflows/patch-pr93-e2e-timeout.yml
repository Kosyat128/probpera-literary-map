name: One-time PR 93 immersive E2E stabilization

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - ".github/workflows/patch-pr93-e2e-timeout.yml"

permissions:
  contents: write

concurrency:
  group: one-time-pr93-immersive-e2e-stabilization
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.pull_request.number == 93 && github.actor == 'Kosyat128'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: fix/admin-safe-premium-readiness
          fetch-depth: 1

      - name: Give the intentional history scenario its own test budget
        shell: bash
        run: |
          set -Eeuo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path("tests/e2e/literary-planet-immersion.spec.mjs")
          source = path.read_text(encoding="utf-8")
          old = '''test("country selection replaces the immersive entry and survives Back/Forward without remounting Canvas", async ({
            page,
            isMobile,
          }) => {
            test.skip(isMobile, "Mobile country presentation has a dedicated sheet test.");'''.replace("          ", "")
          new = '''test("country selection replaces the immersive entry and survives Back/Forward without remounting Canvas", async ({
            page,
            isMobile,
          }) => {
            test.setTimeout(90_000);
            test.skip(isMobile, "Mobile country presentation has a dedicated sheet test.");'''.replace("          ", "")
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one immersive history scenario, found {count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify the test remains intact
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check tests/e2e/literary-planet-immersion.spec.mjs
          python <<'PY'
          from pathlib import Path
          source = Path("tests/e2e/literary-planet-immersion.spec.mjs").read_text(encoding="utf-8")
          title = 'country selection replaces the immersive entry and survives Back/Forward without remounting Canvas'
          start = source.index(title)
          excerpt = source[start:start + 300]
          if "test.setTimeout(90_000);" not in excerpt:
              raise SystemExit("scenario-specific timeout was not applied")
          required = ["page.goBack();", "page.goForward();", "await expectMarkedCanvas(experience);"]
          for assertion in required:
              if assertion not in source[start:]:
                  raise SystemExit(f"required assertion missing: {assertion}")
          PY
          git diff --check

      - name: Commit the targeted stabilization
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "probpera-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/e2e/literary-planet-immersion.spec.mjs
          git commit -m "test(atlas): budget immersive history scenario"
          git push origin HEAD:fix/admin-safe-premium-readiness
