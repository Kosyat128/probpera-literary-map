name: Dispatch premium database reconciliation

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20260823_premium_machine_translation.sql"
      - "supabase/migrations/20260828_zz_editor_autosaves.sql"
      - "supabase/migrations/20260830_media_studio_lifecycle.sql"
      - "supabase/migrations/20260830_zz_site_typography_engine.sql"
      - "supabase/migrations/20260901_zz_admin_analytics_reporting.sql"
      - "supabase/migrations/20260901_zz_data_studio_integrity.sql"
      - "supabase/migrations/20260901_zz_site_studio_engine.sql"
      - "supabase/migrations/20260901_zz_staff_owner_invariant.sql"
      - "supabase/migrations/20260901_zz_translation_operations.sql"
      - "supabase/migrations/20260901_zz_translation_operations_runtime.sql"
      - "supabase/migrations/20260901_zz_visual_direct_edit_v2.sql"
      - "supabase/migrations/20260901_zzz_admin_mutation_guards.sql"
      - "supabase/migrations/20260901_zzzz_admin_ops_observability.sql"
      - "supabase/migrations/20260901_zzzzzz_admin_completion_health.sql"
      - "supabase/migrations/20260902_article_working_drafts.sql"
      - "supabase/migrations/20260902_zz_article_working_drafts_health.sql"
      - "supabase/migrations/20260902_literary_work_authorship.sql"
      - "supabase/migrations/20260902_literary_work_evidence_v2_attestations.sql"
      - "supabase/migrations/20260902_zz_literary_archive_atomic_release.sql"
      - "scripts/sync-literary-archive.mjs"
      - "scripts/lib/book-authorship-roundtrip.mjs"
      - "scripts/lib/book-evidence-v2-attestations.mjs"
      - "scripts/lib/literary-archive-atomic-release.mjs"
      - "scripts/database/verify-book-cover-batch-20260820.mjs"
      - "scripts/database/build-production-migration-plan.mjs"
      - "src/data/**"
      - "data/book-canon-source-registry.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/reconcile-production-database.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-premium-database-reconciliation
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the immutable guarded reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]

          payload="$(
            EXPECTED_MAIN_SHA="$EXPECTED_MAIN_SHA" node <<'NODE'
          process.stdout.write(
            JSON.stringify({
              ref: "main",
              inputs: {
                expected_main_sha: process.env.EXPECTED_MAIN_SHA,
                confirmation: "RECONCILE PRODUCTION DATABASE",
              },
            })
          );
          NODE
          )"

          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/reconcile-production-database.yml/dispatches" \
            --data "$payload"

          echo "Guarded production reconciliation dispatched for $EXPECTED_MAIN_SHA."
