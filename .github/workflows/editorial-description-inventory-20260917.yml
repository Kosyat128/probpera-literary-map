name: Editorial description inventory (read only)

on:
  push:
    branches: [editorial/description-inventory-20260917]
    paths: [.github/workflows/editorial-description-inventory-20260917.yml]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 63ce3112846e3e49f4b15d1cb64b3c29cb98af70
          persist-credentials: false
          sparse-checkout: |
            src
            data
            scripts
            reports
            package.json
            tsconfig.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated bundler (no project lifecycle scripts)
        run: npm install --prefix "$RUNNER_TEMP/editorial-tools" --ignore-scripts --no-audit --no-fund esbuild@0.25.9
      - name: Export repository corpus and retained texts without contacting CMS
        env:
          TOOL_ROOT: ${{ runner.temp }}/editorial-tools
        run: |
          mkdir -p editorial-export
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { build } = await import(pathToFileURL(path.join(process.env.TOOL_ROOT,'node_modules/esbuild/lib/main.js')).href);
          const out = path.resolve('editorial-export');
          const contents = `
            import { bookArchiveCountries } from './src/data/countries/index.ts';
            import { buildBookArchive } from './src/data/bookArchive.ts';
            import { bookR49nRetainedDrafts20260912Data01 as a } from './src/data/countries/bookR49nRetainedDrafts20260912Data01.ts';
            import { bookR49nRetainedDrafts20260912Data02 as b } from './src/data/countries/bookR49nRetainedDrafts20260912Data02.ts';
            import { bookR49nRetainedDrafts20260912Data03 as c } from './src/data/countries/bookR49nRetainedDrafts20260912Data03.ts';
            export const books = buildBookArchive(bookArchiveCountries).map(({country,writer,...book})=>book);
            export const retained = {...a,...b,...c};
          `;
          await build({
            stdin: { contents, resolveDir: process.cwd(), loader: 'ts' },
            bundle:true, platform:'node', format:'esm', target:'node24', packages:'external',
            tsconfigRaw: { compilerOptions: { module:'ESNext', moduleResolution:'Bundler', target:'ES2022' } },
            outfile:path.join(out,'source.mjs'), logLevel:'warning'
          });
          const data = await import(pathToFileURL(path.join(out,'source.mjs')).href);
          if (!Array.isArray(data.books) || data.books.length < 9000) throw new Error('Incomplete source corpus');
          fs.writeFileSync(path.join(out,'repository_book_archive.json'),JSON.stringify({schemaVersion:1,scope:'repository-composed-not-live-cms',sourceRevision:'63ce3112846e3e49f4b15d1cb64b3c29cb98af70',exportedAt:new Date().toISOString(),records:data.books},null,2));
          fs.writeFileSync(path.join(out,'retained_drafts.json'),JSON.stringify(data.retained,null,2));
          fs.unlinkSync(path.join(out,'source.mjs'));
          console.log(JSON.stringify({records:data.books.length,retainedPairs:Object.keys(data.retained).length}));
          NODE
      - name: Preserve tracked textual inputs and checksums
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,zipfile,hashlib,json
          root=pathlib.Path('.');out=root/'editorial-export';out.mkdir(exist_ok=True)
          paths=subprocess.check_output(['git','ls-files','-z','src/data','data','reports','scripts']).decode().split('\0')
          exts={'.ts','.tsx','.json','.md','.mjs','.cjs','.txt','.csv','.py'}
          with zipfile.ZipFile(out/'repository_text_inputs.zip','w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for name in paths:
                  p=root/name
                  if name and p.is_file() and p.suffix.lower() in exts:z.write(p,name)
          manifest={p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in out.iterdir() if p.is_file()}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-description-inventory-20260917
          path: editorial-export/
          compression-level: 9
          retention-days: 7
          if-no-files-found: error
