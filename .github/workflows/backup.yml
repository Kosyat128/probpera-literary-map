name: Encrypted Supabase backup

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * *"

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify backup secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          missing=()
          [[ -n "$SUPABASE_DB_URL" ]] || missing+=(SUPABASE_DB_URL)
          [[ -n "$SUPABASE_URL" ]] || missing+=(VITE_SUPABASE_URL)
          [[ -n "$SUPABASE_SERVICE_ROLE_KEY" ]] || missing+=(SUPABASE_SERVICE_ROLE_KEY)
          [[ -n "$BACKUP_ENCRYPTION_KEY" ]] || missing+=(BACKUP_ENCRYPTION_KEY)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            {
              echo "## Backup configuration is incomplete"
              echo
              echo "Add these GitHub Actions secrets without placing their values in the repository or chat:"
              printf -- '- `%s`\n' "${missing[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if (( ${#BACKUP_ENCRYPTION_KEY} < 32 )); then
            echo "::error::BACKUP_ENCRYPTION_KEY must contain at least 32 characters."
            exit 1
          fi

      - name: Create database and storage backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_OUTPUT_DIR: backup/storage
          DATABASE_IMAGE: public.ecr.aws/supabase/postgres:17.6.1.136
        run: |
          mkdir -p backup/database
          bash scripts/database/supabase-database-safety.sh validate-target
          bash scripts/database/supabase-database-safety.sh dump \
            backup/database/probpera.dump \
            backup/database/auth-user-ids.seed
          npm run backup:storage

      - name: Encrypt and verify archive
        id: archive
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          umask 077
          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          archive="probpera-backup-${stamp}.tar.gz.enc"
          tar -czf backup.tar.gz backup
          bash scripts/database/supabase-database-safety.sh encrypt-verify \
            backup.tar.gz "$archive" verify.tar.gz
          tar -xOf verify.tar.gz backup/database/probpera.dump > verify.dump
          tar -xOf verify.tar.gz backup/database/auth-user-ids.seed > verify-auth-user-ids.seed
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          if [[ "$(date -u +%d)" == "01" ]]; then echo "retention=90" >> "$GITHUB_OUTPUT"; else echo "retention=30" >> "$GITHUB_OUTPUT"; fi

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.archive }}
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.archive }}.sha256
          retention-days: ${{ steps.archive.outputs.retention }}
          if-no-files-found: error

      - name: Restore application schema into an isolated Supabase database
        env:
          DATABASE_IMAGE: public.ecr.aws/supabase/postgres:17.6.1.136
        run: |
          # The encrypted artifact retains the full custom dump. The shared
          # helper waits for final Supabase initialization, verifies Vault, and
          # strictly restores the portable public application slice.
          bash scripts/database/supabase-database-safety.sh restore-drill \
            verify.dump verify-auth-user-ids.seed "" backup/restore-result.env
          source backup/restore-result.env
          [[ "$restore_scope" == "public-application-schema" ]] || exit 1
          [[ "$identity_seed" == "auth-user-id-sidecar-v1" ]] || exit 1
          [[ "$identity_seed_sha256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          {
            echo "Application-schema restore drill passed with $restored_articles article rows and $restored_auth_users verified UUID-only auth identity stubs."
            echo "Verified auth identity sidecar SHA-256: $identity_seed_sha256."
            echo "Restored publication schema: $publication_schema."
            if [[ "$publication_schema" == "pre-20260814" ]]; then
              echo "Apply 20260814 after this verified pre-migration backup; the admin schema health check must then report current."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove plaintext backup material
        if: always()
        run: |
          rm -rf backup
          rm -f backup.tar.gz verify.tar.gz verify.dump verify-auth-user-ids.seed
