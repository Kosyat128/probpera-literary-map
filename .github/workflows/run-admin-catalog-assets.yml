name: Execute admin catalog asset refactor

on:
  push:
    branches:
      - fix/admin-worker-bundle-size
    paths:
      - ".github/workflows/run-admin-catalog-assets.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/run-admin-catalog-assets.yml"

permissions:
  contents: write

concurrency:
  group: execute-admin-catalog-assets
  cancel-in-progress: false

jobs:
  apply-and-prove:
    if: github.actor == 'Kosyat128'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      YANDEX_METRIKA_COUNTER_ID: ${{ vars.YANDEX_METRIKA_COUNTER_ID }}
    steps:
      - name: Checkout worker-size branch
        uses: actions/checkout@v7
        with:
          ref: fix/admin-worker-bundle-size
          fetch-depth: 1

      - name: Extract and execute the reviewed catalog refactor
        shell: bash
        run: |
          set -Eeuo pipefail
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-admin-catalog-assets.yml')
          source = workflow.read_text(encoding='utf-8')
          opener = "          python <<'PY'\n"
          closer = "\n          PY\n"
          start = source.index(opener) + len(opener)
          end = source.index(closer, start)
          body = source[start:end]
          lines = [
              line[10:] if line.startswith('          ') else line
              for line in body.splitlines()
          ]
          script = Path('/tmp/apply-admin-catalog-assets.py')
          script.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'extracted {len(lines)} reviewed refactor lines')
          PY
          python /tmp/apply-admin-catalog-assets.py

      - name: Use Webpack for the Cloudflare production build
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/admin/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const expected = 'node ../../scripts/export-editorial-catalog.mjs && next build';
          if (pkg.scripts.build !== expected) {
            throw new Error(`Unexpected admin build script: ${pkg.scripts.build}`);
          }
          pkg.scripts.build = `${expected} --webpack`;
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Generate and validate catalog assets
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run editorial:catalog
          node scripts/export-editorial-catalog.mjs --check
          npm run lint --workspace @probpera/admin
          npx vitest run \
            apps/admin/lib/editorial-catalog.test.ts \
            apps/admin/lib/env.test.ts
          git diff --check

      - name: Build OpenNext Worker with Webpack
        run: npm run cf:build --workspace @probpera/admin

      - name: Produce exact Wrangler bundle evidence
        id: bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          cd apps/admin
          rm -rf .wrangler-dry
          mkdir -p .wrangler-dry
          npx wrangler deploy \
            --dry-run \
            --outdir .wrangler-dry \
            --metafile .wrangler-dry/meta.json \
            --config wrangler.jsonc \
            2>&1 | tee .wrangler-dry/dry-run.log
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = '.wrangler-dry';
          const log = fs.readFileSync(path.join(directory, 'dry-run.log'), 'utf8');
          const match = log.match(
            /Total Upload:\s*([0-9.]+) KiB\s*\/\s*gzip:\s*([0-9.]+) KiB/u
          );
          if (!match) throw new Error('Wrangler did not report upload sizes');
          const size = {
            rawKiB: Number(match[1]),
            gzipKiB: Number(match[2]),
            maximumGzipKiB: 2900,
          };
          fs.writeFileSync(
            path.join(directory, 'size.json'),
            `${JSON.stringify(size, null, 2)}\n`
          );

          const meta = JSON.parse(
            fs.readFileSync(path.join(directory, 'meta.json'), 'utf8')
          );
          const totals = new Map();
          const outputs = Object.entries(meta.outputs || {}).map(
            ([name, output]) => {
              for (const [inputName, value] of Object.entries(output.inputs || {})) {
                totals.set(
                  inputName,
                  (totals.get(inputName) || 0) + Number(value.bytesInOutput || 0)
                );
              }
              return {
                name,
                bytes: Number(output.bytes || 0),
                inputCount: Object.keys(output.inputs || {}).length,
              };
            }
          ).sort((left, right) => right.bytes - left.bytes);
          const topInputs = [...totals.entries()]
            .map(([name, bytesInOutput]) => ({ name, bytesInOutput }))
            .sort((left, right) => right.bytesInOutput - left.bytesInOutput);
          const summary = {
            size,
            outputs: outputs.slice(0, 100),
            topInputs: topInputs.slice(0, 500),
          };
          fs.writeFileSync(
            path.join(directory, 'bundle-summary.json'),
            `${JSON.stringify(summary, null, 2)}\n`
          );
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload Webpack Worker evidence
        uses: actions/upload-artifact@v7
        with:
          name: admin-worker-webpack-analysis
          path: |
            apps/admin/.wrangler-dry/meta.json
            apps/admin/.wrangler-dry/size.json
            apps/admin/.wrangler-dry/bundle-summary.json
            apps/admin/.wrangler-dry/dry-run.log
          retention-days: 7
          if-no-files-found: error

      - name: Enforce compressed-size budget
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const size = JSON.parse(
            fs.readFileSync('apps/admin/.wrangler-dry/size.json', 'utf8')
          );
          if (size.gzipKiB > size.maximumGzipKiB) {
            throw new Error(
              `Compressed Worker ${size.gzipKiB} KiB exceeds ${size.maximumGzipKiB} KiB`
            );
          }
          NODE
          if grep -R -Fq 'editorial-catalog.generated.json' apps/admin/.wrangler-dry; then
            echo '::error::Legacy monolithic catalog remains in the Worker bundle.'
            exit 1
          fi

      - name: Commit only the proven product changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'probpera-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A \
            .gitignore \
            apps/admin/lib \
            apps/admin/app \
            apps/admin/package.json \
            scripts/export-editorial-catalog.mjs
          git commit -m 'fix(admin): externalize catalog and deduplicate Worker'
          git push origin HEAD:fix/admin-worker-bundle-size
