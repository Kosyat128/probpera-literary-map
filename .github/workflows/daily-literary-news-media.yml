name: Daily literary news media and capture

on:
  workflow_dispatch:
  schedule:
    # Prepare the morning queue before the first 08:00 Moscow delivery slot.
    - cron: "33 4,12,16 * * *"

permissions:
  contents: read

# Share the existing delivery fence. Native preparation owns its separate DO lease.
concurrency:
  group: literary-agenda-delivery
  cancel-in-progress: false

jobs:
  prepare-media:
    if: github.ref == 'refs/heads/main' && vars.LITERARY_NEWS_RUNTIME_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Restore verified photo bytes
        uses: actions/cache@v5
        with:
          path: .tmp/news-social-media
          key: literary-news-jpeg-${{ runner.os }}-${{ hashFiles('data/news/social-media-assets.json', 'scripts/lib/literary-news-media*.mjs', 'package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            literary-news-jpeg-${{ runner.os }}-${{ hashFiles('data/news/social-media-assets.json', 'scripts/lib/literary-news-media*.mjs', 'package-lock.json') }}-
      - name: Materialize bounded licensed photos for the native sender
        id: media
        run: node scripts/sync-literary-news-delivery-media.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Capture complete public admissions and receipts
        if: success()
        run: node scripts/publish-literary-news.mjs --capture
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Run the existing bounded fallback sender
        if: success() && vars.LITERARY_NEWS_SEND_ENABLED == 'true' && vars.LITERARY_NEWS_NATIVE_DELIVERY_ENABLED != 'true'
        run: node scripts/publish-literary-news.mjs --send
        env:
          NEWS_SEND_ENABLED: "true"
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
