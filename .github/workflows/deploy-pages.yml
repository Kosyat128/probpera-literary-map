name: Deploy Vite site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Release mode
        required: true
        default: cms
        type: choice
        options:
          - cms
          - full
      reason:
        description: CMS publication reason
        required: false
        default: manual
        type: string
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  # A five-minute poll must never interrupt a push or an intentional manual release.
  # A newer push/manual run may still supersede an older poll or release.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.release_gate.outputs.should_deploy }}
      scheduled_ids: ${{ steps.scheduled.outputs.ids }}
      rebuild_max_id: ${{ steps.rebuild.outputs.max_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish due scheduled articles
        id: scheduled
        if: github.event_name == 'schedule'
        run: npm run content:publish-scheduled
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Check pending public rebuild requests
        id: rebuild
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/check-public-build-requests.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Decide whether a release is needed
        id: release_gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" || "${{ steps.scheduled.outputs.published }}" != "0" || "${{ steps.rebuild.outputs.requested }}" == "1" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize public article addresses and editorial corrections
        if: steps.release_gate.outputs.should_deploy == 'true'
        run: npm run content:normalize:cms
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_SITE_URL: https://probpera.ru

      - name: Verify public site and editorial archive
        if: steps.release_gate.outputs.should_deploy == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.mode == 'cms')
        run: npm run lint && npm test && npm run content:audit && npm run links:audit && npm run media:audit && npm run books:audit && npm run countries:audit && npm run covers:audit && npm run assets:globe:qa && npm run admin:build

      - name: Verify fast CMS publication
        if: steps.release_gate.outputs.should_deploy == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'cms'
        run: npm run lint:public && npm run links:audit

      - name: Verify registration and forum configuration
        if: steps.release_gate.outputs.should_deploy == 'true'
        run: npm run community:config:check -- --require-env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Verify production analytics configuration
        if: steps.release_gate.outputs.should_deploy == 'true'
        run: npm run analytics:config:check -- --require-env
        env:
          YANDEX_METRIKA_COUNTER_ID: ${{ vars.YANDEX_METRIKA_COUNTER_ID }}

      - name: Build production site
        if: steps.release_gate.outputs.should_deploy == 'true'
        run: npm run build:domain
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_BOOSTY_URL: ${{ vars.VITE_BOOSTY_URL }}
          YANDEX_METRIKA_COUNTER_ID: ${{ vars.YANDEX_METRIKA_COUNTER_ID }}

      - name: Enforce production performance budget
        if: steps.release_gate.outputs.should_deploy == 'true'
        run: npm run performance:audit

      - name: Configure GitHub Pages
        if: steps.release_gate.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Verify required hidden Pages files
        if: steps.release_gate.outputs.should_deploy == 'true'
        shell: bash
        run: test -s dist/.well-known/security.txt

      - name: Upload production artifact
        if: steps.release_gate.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    if: needs.build.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Checkout publication finalizer
        if: needs.build.outputs.scheduled_ids != '' || needs.build.outputs.rebuild_max_id != ''
        uses: actions/checkout@v7

      - name: Set up Node.js for publication finalizer
        if: needs.build.outputs.scheduled_ids != '' || needs.build.outputs.rebuild_max_id != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Finalize scheduled publications
        if: needs.build.outputs.scheduled_ids != ''
        run: node scripts/publish-scheduled-content.mjs --finalize=${{ needs.build.outputs.scheduled_ids }}
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Finalize public rebuild requests
        if: needs.build.outputs.rebuild_max_id != ''
        run: node scripts/check-public-build-requests.mjs --finalize=${{ needs.build.outputs.rebuild_max_id }}
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  distribute:
    name: Distribute published articles
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: social-publication
      cancel-in-progress: false
    needs:
      - build
      - deploy

    steps:
      - name: Checkout social publisher
        uses: actions/checkout@v7

      - name: Set up Node.js for social publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install social publisher dependencies
        run: npm ci

      - name: Verify pending articles in the Dzen feed
        id: social_publish
        run: npm run content:social:publish
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_SITE_URL: https://probpera.ru
          SOCIAL_REQUIRED_PLATFORMS: dzen
          SOCIAL_BOOTSTRAP_LATEST: "true"
          DZEN_RSS_URL: https://probpera.ru/rss.xml

      - name: Summarize social distribution
        if: always()
        shell: bash
        run: |
          {
            echo "## Автопубликация материалов"
            echo
            if [[ "${{ steps.social_publish.outcome }}" == "success" ]]; then
              echo "✅ RSS Дзена проверен: материал и ведущая иллюстрация доступны."
            else
              echo "❌ Не все обязательные каналы обработаны. Незавершённые задания повторит отдельный social workflow."
            fi
            echo
            echo "Автопубликация во ВКонтакте отключена редакционной политикой."
          } >> "$GITHUB_STEP_SUMMARY"
