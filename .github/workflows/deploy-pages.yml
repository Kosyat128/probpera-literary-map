name: Deploy Vite site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Release mode
        required: true
        default: cms
        type: choice
        options:
          - cms
          - full
      reason:
        description: CMS publication reason
        required: false
        default: manual
        type: string
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  # One production release owns the complete code+CMS snapshot lifecycle. A
  # newer request is coalesced behind it and can never cancel midway or let an
  # older artifact overtake a newer production state.
  cancel-in-progress: false
  # Preserve every pending code/CMS owner instead of GitHub's default
  # single-pending replacement. GitHub currently supports up to 100 queued runs.
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
    outputs:
      should_deploy: ${{ steps.release_gate.outputs.should_deploy }}
      publication_article_count: ${{ steps.publication_snapshot.outputs.article_count }}
      publication_head_source: ${{ steps.publication_snapshot.outputs.publication_head_source }}
      publication_outbox_high_water: ${{ steps.publication_snapshot.outputs.outbox_high_water }}
      publication_legacy_audit_high_water: ${{ steps.publication_snapshot.outputs.legacy_audit_high_water }}
      publication_queue_marker: ${{ steps.publication_snapshot.outputs.publication_queue_marker }}
      publication_content_sha256: ${{ steps.publication_snapshot.outputs.content_sha256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Release verification includes the pinned Stage 5 baseline tests.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish due scheduled articles
        id: scheduled
        if: github.event_name == 'schedule'
        run: npm run content:publish-scheduled
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Check pending public rebuild requests
        id: rebuild
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/check-public-build-requests.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Check whether production is behind the scheduled code head
        id: deployed_code
        if: github.event_name == 'schedule'
        run: node scripts/check-deployed-release-head.mjs
        env:
          EXPECTED_MAIN_SHA: ${{ github.sha }}
          PUBLIC_SITE_URL: https://probpera.ru

      - name: Decide whether a release is needed
        id: release_gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" || "${{ steps.scheduled.outputs.published }}" != "0" || "${{ steps.rebuild.outputs.requested }}" == "1" || "${{ steps.deployed_code.outputs.code_pending }}" == "1" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify immutable repository content locks
        if: steps.release_gate.outputs.should_deploy == 'true'
        run: npx vitest run scripts/lib/stage5-content-data-lock.test.mjs

      - name: Normalize public article addresses and editorial corrections
        if: steps.release_gate.outputs.should_deploy == 'true'
        run: npm run content:normalize:cms
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_SITE_URL: https://probpera.ru

      - name: Export current CMS snapshot for release verification
        if: steps.release_gate.outputs.should_deploy == 'true'
        run: npm run content:export:cms
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_SITE_URL: https://probpera.ru
          CMS_EXPORT_REQUIRE_STABLE: "true"
          CMS_PUBLICATION_BASELINE_URL: https://probpera.ru/cms/published-content.json

      - name: Regenerate CMS-derived article and book links
        if: steps.release_gate.outputs.should_deploy == 'true'
        run: npm run content:link-books

      - name: Verify public site and editorial archive
        if: steps.release_gate.outputs.should_deploy == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.mode == 'cms')
        # Historical fixture tests run before refreshing this read-only provenance
        # report; books:audit then checks it against the freshly exported CMS head.
        run: npm run lint && npm test -- --exclude scripts/lib/stage5-content-data-lock.test.mjs && npm run content:audit && npm run links:audit && npm run media:audit && node scripts/extract-article-book-synopsis-manifest.mjs && npm run books:audit && npm run countries:audit && npm run covers:audit && npm run assets:globe:qa && npm run admin:build

      - name: Verify fast CMS publication
        if: steps.release_gate.outputs.should_deploy == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'cms'
        run: npm run lint:public && npm run links:audit

      - name: Verify registration and forum configuration
        if: steps.release_gate.outputs.should_deploy == 'true'
        run: npm run community:config:check -- --require-env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Verify production analytics configuration
        if: steps.release_gate.outputs.should_deploy == 'true'
        run: npm run analytics:config:check -- --require-env
        env:
          YANDEX_METRIKA_COUNTER_ID: ${{ vars.YANDEX_METRIKA_COUNTER_ID }}

      - name: Re-export and freeze the complete CMS publication head
        id: publication_snapshot
        if: steps.release_gate.outputs.should_deploy == 'true'
        run: npm run content:export:cms
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_SITE_URL: https://probpera.ru
          CMS_EXPORT_REQUIRE_STABLE: "true"
          CMS_PUBLICATION_BASELINE_URL: https://probpera.ru/cms/published-content.json

      - name: Verify complete writer biography release artifacts
        if: steps.release_gate.outputs.should_deploy == 'true'
        run: npm run writers:biographies:reviews:check && npm run writers:biographies:russian:editorial:check && npm run writers:biographies:english:paused:check

      - name: Verify the frozen CMS publication snapshot
        if: steps.release_gate.outputs.should_deploy == 'true'
        run: npm run content:audit && npm run links:audit

      - name: Build production site
        if: steps.release_gate.outputs.should_deploy == 'true'
        run: npm run build:domain
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_BOOSTY_URL: ${{ vars.VITE_BOOSTY_URL }}
          YANDEX_METRIKA_COUNTER_ID: ${{ vars.YANDEX_METRIKA_COUNTER_ID }}
          CMS_SNAPSHOT_PREEXPORTED: "true"
          RELEASE_COMMIT_SHA: ${{ github.sha }}

      - name: Enforce production performance budget
        if: steps.release_gate.outputs.should_deploy == 'true'
        run: npm run performance:audit

      - name: Configure GitHub Pages
        if: steps.release_gate.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Verify required hidden Pages files
        if: steps.release_gate.outputs.should_deploy == 'true'
        shell: bash
        run: test -s dist/.well-known/security.txt

      - name: Upload production artifact
        if: steps.release_gate.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    if: needs.build.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout publication guard
        uses: actions/checkout@v7

      - name: Set up Node.js for publication guard
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Refuse stale code or CMS publication heads
        run: npm run content:publication:head-check
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ github.sha }}
          CANDIDATE_ARTICLE_COUNT: ${{ needs.build.outputs.publication_article_count }}
          CANDIDATE_PUBLICATION_HEAD_SOURCE: ${{ needs.build.outputs.publication_head_source }}
          CANDIDATE_OUTBOX_HIGH_WATER: ${{ needs.build.outputs.publication_outbox_high_water }}
          CANDIDATE_LEGACY_AUDIT_HIGH_WATER: ${{ needs.build.outputs.publication_legacy_audit_high_water }}
          CANDIDATE_CONTENT_SHA256: ${{ needs.build.outputs.publication_content_sha256 }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  post_deploy_security_audit:
    name: Dispatch the live security audit
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Audit the promoted public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run audit-live-security.yml --repo "$GITHUB_REPOSITORY" --ref main

  publication_followup:
    name: Coalesce a post-deploy CMS follow-up
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy
    outputs:
      safe_to_finalize: ${{ steps.postdeploy_followup.outputs.safe_to_finalize }}
    # GitHub permissions cannot be scoped to one step. Keep Actions write in
    # this single-purpose job; build, deployment and finalization never receive it.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout publication follow-up guard
        uses: actions/checkout@v7

      - name: Set up Node.js for publication follow-up guard
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Coalesce an immediate CMS follow-up after Pages promotion
        id: postdeploy_followup
        continue-on-error: true
        run: npm run content:publication:coalesce
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ github.sha }}
          CANDIDATE_PUBLICATION_HEAD_SOURCE: ${{ needs.build.outputs.publication_head_source }}
          CANDIDATE_OUTBOX_HIGH_WATER: ${{ needs.build.outputs.publication_outbox_high_water }}
          CANDIDATE_LEGACY_AUDIT_HIGH_WATER: ${{ needs.build.outputs.publication_legacy_audit_high_water }}

      - name: Record the scheduled-poll fallback
        if: steps.postdeploy_followup.outcome != 'success'
        shell: bash
        run: |
          {
            echo "## Immediate follow-up dispatch was unavailable"
            echo
            echo "The promoted artifact remains a valid snapshot, but its outbox marker is not acknowledged."
            echo "The five-minute transactional outbox poll remains the fail-closed recovery path."
          } >> "$GITHUB_STEP_SUMMARY"

  finalize_publication:
    name: Finalize the deployed CMS snapshot
    if: needs.publication_followup.outputs.safe_to_finalize == 'true'
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy
      - publication_followup
    permissions:
      contents: read

    steps:
      - name: Checkout publication finalizer
        uses: actions/checkout@v7

      - name: Set up Node.js for publication finalizer
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Finalize the deployed composite CMS snapshot
        if: needs.build.outputs.publication_queue_marker != ''
        run: node scripts/check-public-build-requests.mjs --finalize=${{ needs.build.outputs.publication_queue_marker }}
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  distribute:
    name: Distribute published articles
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: social-publication
      cancel-in-progress: false
    needs:
      - build
      - deploy

    steps:
      - name: Checkout social publisher
        uses: actions/checkout@v7

      - name: Set up Node.js for social publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install social publisher dependencies
        run: npm ci

      - name: Verify pending articles in the Dzen feed
        id: social_publish
        run: npm run content:social:publish
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_SITE_URL: https://probpera.ru
          SOCIAL_REQUIRED_PLATFORMS: dzen
          SOCIAL_BOOTSTRAP_LATEST: "true"
          DZEN_RSS_URL: https://probpera.ru/rss.xml

      - name: Summarize social distribution
        if: always()
        shell: bash
        run: |
          {
            echo "## Автопубликация материалов"
            echo
            if [[ "${{ steps.social_publish.outcome }}" == "success" ]]; then
              echo "✅ RSS Дзена проверен: материал и ведущая иллюстрация доступны."
            else
              echo "❌ Не все обязательные каналы обработаны. Незавершённые задания повторит отдельный social workflow."
            fi
            echo
            echo "Автопубликация во ВКонтакте отключена редакционной политикой."
          } >> "$GITHUB_STEP_SUMMARY"
