name: Retry social publication

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: social-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Verify pending articles in Dzen
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout social publisher
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install social publisher dependencies
        run: npm ci

      - name: Verify pending articles in the Dzen feed
        id: social_publish
        run: npm run content:social:publish
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_SITE_URL: https://probpera.ru
          SOCIAL_REQUIRED_PLATFORMS: dzen
          SOCIAL_BOOTSTRAP_LATEST: "true"
          DZEN_RSS_URL: https://probpera.ru/rss.xml

      - name: Summarize social publication
        if: always()
        shell: bash
        run: |
          {
            echo "## Повтор автопубликации"
            echo
            echo "Запуск: \`${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\`"
            echo
            if [[ "${{ steps.social_publish.outcome }}" == "success" ]]; then
              echo "✅ Очередь обязательных каналов обработана без ошибок."
            else
              echo "❌ Остались необработанные обязательные каналы. Следующая автоматическая попытка — не позднее чем через 10 минут."
            fi
            echo
            echo "Обязательный канал: RSS Дзена. Автопубликация во ВКонтакте отключена редакционной политикой."
          } >> "$GITHUB_STEP_SUMMARY"
