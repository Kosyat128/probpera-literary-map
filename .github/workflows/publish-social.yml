name: Retry social publication

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: social-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish pending articles to social channels
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout social publisher
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Publish pending articles to VK and Dzen feed
        id: social_publish
        run: npm run content:social:publish
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_SITE_URL: https://probpera.ru
          SOCIAL_REQUIRED_PLATFORMS: vk,dzen
          SOCIAL_BOOTSTRAP_LATEST: "true"
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_USER_ACCESS_TOKEN: ${{ secrets.VK_USER_ACCESS_TOKEN }}
          OK_GROUP_ID: ${{ secrets.OK_GROUP_ID }}
          OK_APPLICATION_KEY: ${{ secrets.OK_APPLICATION_KEY }}
          OK_ACCESS_TOKEN: ${{ secrets.OK_ACCESS_TOKEN }}
          OK_SESSION_SECRET_KEY: ${{ secrets.OK_SESSION_SECRET_KEY }}
          DZEN_RSS_URL: https://probpera.ru/rss.xml

      - name: Summarize social publication
        if: always()
        shell: bash
        run: |
          {
            echo "## Повтор автопубликации"
            echo
            echo "Запуск: \`${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\`"
            echo
            if [[ "${{ steps.social_publish.outcome }}" == "success" ]]; then
              echo "✅ Очередь обязательных каналов обработана без ошибок."
            else
              echo "❌ Остались необработанные обязательные каналы. Следующая автоматическая попытка — не позднее чем через 10 минут."
            fi
            echo
            echo "Обязательные каналы: ВКонтакте и RSS Дзена. Одноклассники станут обязательными после настройки секретов."
          } >> "$GITHUB_STEP_SUMMARY"
