name: Reconcile production database

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact 40-character main commit SHA to reconcile"
        required: true
        type: string
      confirmation:
        description: "Type exactly: RECONCILE PRODUCTION DATABASE"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: production

    steps:
      - name: Checkout the approved main commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate immutable invocation
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          [[ "$CONFIRMATION" == "RECONCILE PRODUCTION DATABASE" ]] || {
            echo "::error::The production confirmation text is not exact."
            exit 1
          }
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::expected_main_sha must be 40 lowercase hexadecimal characters."
            exit 1
          }
          [[ "$GITHUB_SHA" == "$EXPECTED_MAIN_SHA" ]] || {
            echo "::error::The checked-out workflow commit does not match expected_main_sha."
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" ]] || {
            echo "::error::The checkout does not match expected_main_sha."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pre-pull and pin the database image for this runner
        env:
          DATABASE_IMAGE: public.ecr.aws/supabase/postgres:17.6.1.136
        run: |
          set -Eeuo pipefail
          pulled=false
          for retry_delay in 0 15 30 60 120 240; do
            if (( retry_delay > 0 )); then
              echo "Waiting ${retry_delay}s before retrying the pinned database image pull."
              sleep "$retry_delay"
            fi
            if docker pull "$DATABASE_IMAGE" >/dev/null; then
              pulled=true
              break
            fi
            echo "::warning::Pinned database image pull failed; the bounded retry policy remains fail-closed."
          done
          [[ "$pulled" == true ]] || {
            echo "::error::Unable to pull the pinned database image within the bounded retry policy."
            exit 1
          }

          database_image_id="$(
            docker image inspect --format '{{.Id}}' "$DATABASE_IMAGE"
          )"
          database_image_digest="$(
            docker image inspect \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              "$DATABASE_IMAGE" \
              | awk '/^public\.ecr\.aws\/supabase\/postgres@sha256:[0-9a-f]{64}$/ { print; exit }'
          )"
          [[ "$database_image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::The pulled database image did not expose a canonical local image ID."
            exit 1
          }
          [[ "$database_image_digest" =~ ^public\.ecr\.aws/supabase/postgres@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::The pulled database image did not expose the expected repository digest."
            exit 1
          }
          {
            echo "DATABASE_IMAGE_LOCAL_ID=$database_image_id"
            echo "DATABASE_IMAGE_LOCAL_DIGEST=$database_image_digest"
          } >> "$GITHUB_ENV"

      - name: Verify production secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -Eeuo pipefail
          missing=()
          [[ -n "$SUPABASE_DB_URL" ]] || missing+=(SUPABASE_DB_URL)
          [[ -n "$SUPABASE_URL" ]] || missing+=(VITE_SUPABASE_URL)
          [[ -n "$SUPABASE_SERVICE_ROLE_KEY" ]] || missing+=(SUPABASE_SERVICE_ROLE_KEY)
          [[ -n "$BACKUP_ENCRYPTION_KEY" ]] || missing+=(BACKUP_ENCRYPTION_KEY)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi
          if (( ${#BACKUP_ENCRYPTION_KEY} < 32 )); then
            echo "::error::BACKUP_ENCRYPTION_KEY must contain at least 32 characters."
            exit 1
          fi

      - name: Build reviewed migration plan
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -Eeuo pipefail
          mkdir -p reconciliation
          node scripts/database/build-production-migration-plan.mjs \
            --output reconciliation/plan.sql \
            --manifest reconciliation/migration-manifest.json \
            --verification reconciliation/verify.sql \
            --repository-sha "$EXPECTED_MAIN_SHA"
          {
            echo "# Production database reconciliation"
            echo
            printf '%s\n' "- Repository SHA: $EXPECTED_MAIN_SHA"
            echo "- Migration range: 20260808_article_translations through 20260905_article_publication_permissions"
            echo "- Guard: exact reviewed SHA-256 allowlist"
          } > reconciliation/summary.md

      - name: Verify production database identity
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          DATABASE_IMAGE: public.ecr.aws/supabase/postgres:17.6.1.136
        run: bash scripts/database/supabase-database-safety.sh validate-target

      - name: Create full custom-format production backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          DATABASE_IMAGE: public.ecr.aws/supabase/postgres:17.6.1.136
        run: |
          bash scripts/database/supabase-database-safety.sh dump \
            reconciliation/production-before.dump \
            reconciliation/auth-user-ids.seed

      - name: Encrypt and verify pre-migration backup
        id: archive
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -Eeuo pipefail
          archive="reconciliation/probpera-pre-migration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.dump.enc"
          identity_archive="reconciliation/probpera-auth-user-ids-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.seed.enc"
          bash scripts/database/supabase-database-safety.sh encrypt-verify \
            reconciliation/production-before.dump \
            "$archive" \
            reconciliation/production-before.verified.dump
          bash scripts/database/supabase-database-safety.sh encrypt-verify \
            reconciliation/auth-user-ids.seed \
            "$identity_archive" \
            reconciliation/auth-user-ids.verified.seed
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "identity_archive=$identity_archive" >> "$GITHUB_OUTPUT"
          echo "- Encrypted full-database pre-migration backup and UUID-only auth identity sidecar: verified byte-for-byte" >> reconciliation/summary.md

      - name: Persist encrypted backup before any production mutation
        uses: actions/upload-artifact@v7
        with:
          name: production-db-pre-migration-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.archive }}.sha256
            ${{ steps.archive.outputs.identity_archive }}
            ${{ steps.archive.outputs.identity_archive }}.sha256
            reconciliation/migration-manifest.json
            reconciliation/summary.md
          retention-days: 90
          if-no-files-found: error

      - name: Restore and reconcile the isolated application schema
        env:
          DATABASE_IMAGE: public.ecr.aws/supabase/postgres:17.6.1.136
        run: |
          set -Eeuo pipefail
          bash scripts/database/supabase-database-safety.sh restore-drill \
            reconciliation/production-before.verified.dump \
            reconciliation/auth-user-ids.verified.seed \
            reconciliation/plan.sql \
            reconciliation/restore-result.env
          source reconciliation/restore-result.env
          [[ "$restore_scope" == "public-application-schema" ]] || exit 1
          [[ "$identity_seed" == "auth-user-id-sidecar-v1" ]] || exit 1
          [[ "$identity_seed_sha256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$migration_plan" == "verified" ]] || exit 1
          [[ "$publication_schema" == "20260814-current" ]] || exit 1
          printf '%s\n' \
            "- Isolated application-schema restore drill: passed ($restored_articles article rows; $restored_auth_users verified UUID-only auth identity stubs)" \
            "- Verified auth identity sidecar SHA-256: $identity_seed_sha256" \
            "- Isolated migration plan: passed" \
            >> reconciliation/summary.md

      - name: Reconfirm the current main tip
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -Eeuo pipefail
          current_main_sha="$(
            git ls-remote --exit-code origin refs/heads/main \
              | awk '{ print $1 }'
          )"
          [[ "$current_main_sha" == "$EXPECTED_MAIN_SHA" ]] || {
            echo "::error::main advanced after approval; start a new reviewed run."
            exit 1
          }

      - name: Apply the verified plan to production
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          DATABASE_IMAGE: public.ecr.aws/supabase/postgres:17.6.1.136
        run: |
          set -Eeuo pipefail
          bash scripts/database/supabase-database-safety.sh apply-plan \
            reconciliation/plan.sql
          echo "- Production transaction: committed" >> reconciliation/summary.md

      - name: Verify production schema health and invariants
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          DATABASE_IMAGE: public.ecr.aws/supabase/postgres:17.6.1.136
        run: |
          set -Eeuo pipefail
          bash scripts/database/supabase-database-safety.sh verify-production \
            reconciliation/verify.sql \
            reconciliation/production-verification.txt
          expected='schema_health=20260902_zz_article_working_drafts_health;outbox=true;outbox_rpc=true;article_bundle_rpc=true;publication_triggers=true;staff_editorial_read_policies=true;revision_history=true;work_translations=true;work_cover_artworks=true;literary_work_authorship=true;literary_work_evidence_v2=true;literary_archive_atomic_release=true;country_overrides=true;writer_overrides=true;homepage_move=true;tags_updated_at=true;media_studio_lifecycle=true;media_usage_graph=true;media_safe_replace_rpc=true;site_typography_engine=true;site_studio_engine=true;visual_direct_edit_v2=true;staff_owner_invariant=true;data_studio_integrity=true;translation_operations=true;admin_mutation_guards=true;admin_analytics_reporting=true;admin_ops_observability=true;article_working_drafts=true;article_publication_rbac=true;article_translation_rbac=true;article_working_draft_promotion_cas=true;migration_ledger=true;premium_machine_translation=true;editor_autosaves=true;editor_autosave_rpc=true;ledger_entries=35;invalid_indexes=0'
          printf '%s\n' "$expected" > reconciliation/production-verification-expected.txt
          actual="$(tr -d '\r\n' < reconciliation/production-verification.txt)"
          [[ "$actual" == "$expected" ]] || {
            echo "::error::Production verification did not return the exact current-schema contract."
            exit 1
          }
          echo "- Production schema health and invariants: passed" >> reconciliation/summary.md
          printf '%s\n' \
            "- Expected production verification: $expected" \
            "- Actual production verification: $actual" \
            >> reconciliation/summary.md

      - name: Validate the pinned atomic archive service credential
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          node scripts/database/verify-book-cover-batch-20260820.mjs
          --validate-environment-only

      - name: Install the locked dependency graph for the archive release
        run: npm ci

      - name: Run the read-only full archive preflight
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-literary-archive.mjs --preflight

      - name: Reconfirm the exact main tip before the archive commit
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -Eeuo pipefail
          current_main_sha="$(
            git ls-remote --exit-code origin refs/heads/main \
              | awk '{ print $1 }'
          )"
          [[ "$current_main_sha" == "$EXPECTED_MAIN_SHA" ]] || {
            echo "::error::main advanced after archive preflight; start a new reviewed run."
            exit 1
          }

      - name: Publish the full literary archive in one atomic commit
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -Eeuo pipefail
          node scripts/sync-literary-archive.mjs --apply \
            --enable-evidence-v2 \
            --receipt-file reconciliation/literary-archive-release-receipt.json
          echo "- Full literary archive atomic release: committed" >> reconciliation/summary.md

      - name: Run the read-only atomic archive postflight
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -Eeuo pipefail
          node scripts/sync-literary-archive.mjs --postflight \
            --receipt-file reconciliation/literary-archive-release-receipt.json
          node scripts/database/verify-book-cover-batch-20260820.mjs
          echo "- Atomic archive postflight and reviewed cover subset: passed" >> reconciliation/summary.md

      - name: Finalize redacted summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          if [[ -f reconciliation/summary.md ]]; then
            printf '%s\n' "- Workflow status at summary: $JOB_STATUS" >> reconciliation/summary.md
            cat reconciliation/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload final redacted evidence
        if: always() && steps.archive.outputs.archive != ''
        uses: actions/upload-artifact@v7
        with:
          name: production-db-reconciliation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reconciliation/migration-manifest.json
            reconciliation/summary.md
            reconciliation/literary-archive-release-receipt.json
            reconciliation/production-verification-expected.txt
            reconciliation/production-verification.txt
          retention-days: 90
          if-no-files-found: error

      - name: Remove plaintext database material
        if: always()
        run: |
          rm -f \
            reconciliation/production-before.dump \
            reconciliation/production-before.verified.dump \
            reconciliation/auth-user-ids.seed \
            reconciliation/auth-user-ids.verified.seed \
            reconciliation/plan.sql \
            reconciliation/verify.sql \
            reconciliation/restore-result.env \
            reconciliation/production-verification-expected.txt \
            reconciliation/production-verification.txt
