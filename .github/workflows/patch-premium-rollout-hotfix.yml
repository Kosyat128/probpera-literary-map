name: One-time premium rollout hotfix patch

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - ".github/workflows/patch-premium-rollout-hotfix.yml"

permissions:
  contents: write

concurrency:
  group: one-time-premium-rollout-hotfix-patch
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.pull_request.number == 91 && github.actor == 'Kosyat128'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v7
        with:
          ref: hotfix/premium-rollout-budget
          fetch-depth: 1

      - name: Canonicalize PostgreSQL boolean output
        shell: bash
        run: |
          set -Eeuo pipefail
          python <<'PY'
          from pathlib import Path

          planner = Path("scripts/database/build-production-migration-plan.mjs")
          source = planner.read_text(encoding="utf-8")
          old = "  ';premium_machine_translation=', public.premium_machine_translation_ready(),"
          new = "  ';premium_machine_translation=', case when public.premium_machine_translation_ready() then 'true' else 'false' end,"
          if source.count(old) != 1:
              raise SystemExit("expected exactly one raw premium boolean output")
          planner.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("scripts/database/production-migration-plan.test.mjs")
          test_source = test_path.read_text(encoding="utf-8")
          marker = '      expect(verification).toContain("premium_machine_translation=");'
          replacement = marker + '\n      expect(verification).toContain("then \'true\' else \'false\' end");'
          if test_source.count(marker) != 1:
              raise SystemExit("expected exactly one premium verification assertion")
          test_path.write_text(
              test_source.replace(marker, replacement, 1),
              encoding="utf-8",
          )
          PY

      - name: Verify migration planner and performance audit
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npx vitest run \
            scripts/database/production-migration-plan.test.mjs \
            scripts/audit-performance-budget.test.mjs
          node scripts/database/build-production-migration-plan.mjs \
            --output /tmp/plan.sql \
            --manifest /tmp/manifest.json \
            --verification /tmp/verify.sql \
            --repository-sha 5950d4f46f632e6290db09e8afe6f78b7b5c7114
          grep -Fq "then 'true' else 'false' end" /tmp/verify.sql
          git diff --check

      - name: Commit production contract fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "probpera-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            scripts/database/build-production-migration-plan.mjs \
            scripts/database/production-migration-plan.test.mjs
          git commit -m "fix(db): canonicalize premium readiness output"
          git push origin HEAD:hotfix/premium-rollout-budget
