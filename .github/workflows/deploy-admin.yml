name: Deploy editorial admin

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/admin/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-admin.yml"

permissions:
  contents: read

concurrency:
  group: deploy-editorial-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ADMIN_BASE_PATH: /
      ADMIN_ALLOWED_ORIGINS: admin.probpera.ru
      NEXT_PUBLIC_ADMIN_URL: https://admin.probpera.ru
      NEXT_PUBLIC_SITE_URL: https://probpera.ru
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate application configuration
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"

      - name: Install dependencies
        run: npm ci

      - name: Type-check admin
        run: npm run lint --workspace @probpera/admin

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm run cf:deploy --workspace @probpera/admin
