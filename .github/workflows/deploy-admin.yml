name: Deploy editorial admin

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/admin/**"
      - "src/data/countries/**"
      - "src/data/cms/**"
      - "src/i18n/InterfaceLanguage.tsx"
      - "src/utils/countryFlag.ts"
      - "src/data/geo/countries.geojson"
      - "scripts/lib/modern-globe-site-copy.mjs"
      - "scripts/archive-source.ts"
      - "scripts/export-editorial-catalog.mjs"
      - "scripts/export-interface-copy-catalog.mjs"
      - "scripts/check-admin-worker-size.mjs"
      - "scripts/admin-deploy-workflow.source.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-admin.yml"
  pull_request:
    paths:
      - "apps/admin/**"
      - "src/data/countries/**"
      - "src/data/cms/**"
      - "src/i18n/InterfaceLanguage.tsx"
      - "src/utils/countryFlag.ts"
      - "src/data/geo/countries.geojson"
      - "scripts/lib/modern-globe-site-copy.mjs"
      - "scripts/archive-source.ts"
      - "scripts/export-editorial-catalog.mjs"
      - "scripts/export-interface-copy-catalog.mjs"
      - "scripts/check-admin-worker-size.mjs"
      - "scripts/admin-deploy-workflow.source.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-admin.yml"

permissions:
  contents: read

concurrency:
  group: deploy-editorial-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ADMIN_BASE_PATH: /
      ADMIN_ALLOWED_ORIGINS: admin.probpera.ru
      NEXT_PUBLIC_ADMIN_URL: https://admin.probpera.ru
      NEXT_PUBLIC_SITE_URL: https://probpera.ru
      YANDEX_METRIKA_COUNTER_ID: ${{ vars.YANDEX_METRIKA_COUNTER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure pull request build environment
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          printf '%s\n' \
            "NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co" \
            "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder" \
            >> "$GITHUB_ENV"

      - name: Validate application configuration
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          [[ "$YANDEX_METRIKA_COUNTER_ID" =~ ^[0-9]+$ ]]

          printf '%s\n' \
            "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" \
            "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Generate private admin catalogs
        run: |
          npm run editorial:catalog
          npm run interface:copy:catalog

      - name: Type-check admin
        run: npm run lint --workspace @probpera/admin

      - name: Build and verify Cloudflare Worker
        run: |
          npm run cf:build --workspace @probpera/admin
          npm run cf:size --workspace @probpera/admin

      - name: Verify preseeded private admin catalogs
        if: github.event_name != 'pull_request'
        env:
          ADMIN_EDITORIAL_CATALOG_SHA256: ${{ vars.ADMIN_EDITORIAL_CATALOG_SHA256 }}
          ADMIN_INTERFACE_COPY_CATALOG_SHA256: ${{ vars.ADMIN_INTERFACE_COPY_CATALOG_SHA256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for expected in \
            "$ADMIN_EDITORIAL_CATALOG_SHA256" \
            "$ADMIN_INTERFACE_COPY_CATALOG_SHA256"; do
            if [[ ! "$expected" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::A required preseeded admin catalog SHA-256 variable is missing or invalid."
              exit 1
            fi
          done

          editorial_sha="$(sha256sum apps/admin/catalog-assets/editorial-catalog.json | awk '{print $1}')"
          interface_sha="$(sha256sum apps/admin/catalog-assets/interface-copy-catalog.json | awk '{print $1}')"

          if [[ "$editorial_sha" != "$ADMIN_EDITORIAL_CATALOG_SHA256" ]] ||
             [[ "$interface_sha" != "$ADMIN_INTERFACE_COPY_CATALOG_SHA256" ]]; then
            echo "::error::Checked-in admin catalogs do not match the preseeded private Workers KV values."
            exit 1
          fi
          echo "Verified checked-in catalogs against preseeded private Workers KV SHA-256 values."

      - name: Inspect premium translation secret
        if: github.event_name != 'pull_request'
        id: premium_secret
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          cd apps/admin

          # An optional GitHub Actions copy lets CI provision or rotate the
          # Worker secret without putting its value in source or command args.
          if [[ -n "${OPENAI_API_KEY:-}" ]]; then
            printf '%s' "$OPENAI_API_KEY" \
              | npx wrangler secret put OPENAI_API_KEY --config wrangler.jsonc
          fi

          secret_list="$(npx wrangler secret list --config wrangler.jsonc)"
          has_secret="$(
            SECRET_LIST="$secret_list" node <<'NODE'
          const raw = process.env.SECRET_LIST || "[]";
          let secrets;
          try {
            secrets = JSON.parse(raw);
          } catch {
            throw new Error("Wrangler did not return a valid secret inventory");
          }
          process.stdout.write(
            String(
              Array.isArray(secrets) &&
                secrets.some((entry) => entry?.name === "OPENAI_API_KEY")
            )
          );
          NODE
          )"

          if [[ "$has_secret" == "true" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Premium English automation is ready."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENAI_API_KEY is not configured on Cloudflare Worker probpera-admin. The admin will deploy with every premium auto-translation path safely disabled; manual RU/EN editing remains available."
          fi

      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm run cf:deploy:built --workspace @probpera/admin

      - name: Report premium translation readiness
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          PREMIUM_SECRET_READY: ${{ steps.premium_secret.outputs.ready }}
        shell: bash
        run: |
          if [[ "$PREMIUM_SECRET_READY" == "true" ]]; then
            echo "### Premium English: ready" >> "$GITHUB_STEP_SUMMARY"
            echo "Cloudflare Worker secret OPENAI_API_KEY is configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Premium English: safely disabled" >> "$GITHUB_STEP_SUMMARY"
            echo "The admin is deployed, but automatic translation remains disabled until OPENAI_API_KEY is added as a Worker or GitHub Actions secret." >> "$GITHUB_STEP_SUMMARY"
          fi
