name: Deploy editorial admin

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/admin/**"
      - "src/data/countries/**"
      - "src/data/cms/**"
      - "scripts/archive-source.ts"
      - "scripts/export-editorial-catalog.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-admin.yml"

permissions:
  contents: read

concurrency:
  group: deploy-editorial-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ADMIN_BASE_PATH: /
      ADMIN_ALLOWED_ORIGINS: admin.probpera.ru
      NEXT_PUBLIC_ADMIN_URL: https://admin.probpera.ru
      NEXT_PUBLIC_SITE_URL: https://probpera.ru
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      YANDEX_METRIKA_COUNTER_ID: ${{ vars.YANDEX_METRIKA_COUNTER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate application configuration
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          [[ "$YANDEX_METRIKA_COUNTER_ID" =~ ^[0-9]+$ ]]

      - name: Install dependencies
        run: npm ci

      - name: Generate the complete editorial catalog
        run: npm run editorial:catalog

      - name: Type-check admin
        run: npm run lint --workspace @probpera/admin

      - name: Inspect premium translation secret
        id: premium_secret
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          cd apps/admin

          # An optional GitHub Actions copy lets CI provision or rotate the
          # Worker secret without putting its value in source or command args.
          if [[ -n "${OPENAI_API_KEY:-}" ]]; then
            printf '%s' "$OPENAI_API_KEY" \
              | npx wrangler secret put OPENAI_API_KEY --config wrangler.jsonc
          fi

          secret_list="$(npx wrangler secret list --config wrangler.jsonc)"
          has_secret="$(
            SECRET_LIST="$secret_list" node <<'NODE'
          const raw = process.env.SECRET_LIST || "[]";
          let secrets;
          try {
            secrets = JSON.parse(raw);
          } catch {
            throw new Error("Wrangler did not return a valid secret inventory");
          }
          process.stdout.write(
            String(
              Array.isArray(secrets) &&
                secrets.some((entry) => entry?.name === "OPENAI_API_KEY")
            )
          );
          NODE
          )"

          if [[ "$has_secret" == "true" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Premium English automation is ready."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENAI_API_KEY is not configured on Cloudflare Worker probpera-admin. The admin will deploy with every premium auto-translation path safely disabled; manual RU/EN editing remains available."
          fi

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm run cf:deploy --workspace @probpera/admin

      - name: Report premium translation readiness
        if: always()
        env:
          PREMIUM_SECRET_READY: ${{ steps.premium_secret.outputs.ready }}
        shell: bash
        run: |
          if [[ "$PREMIUM_SECRET_READY" == "true" ]]; then
            echo "### Premium English: ready" >> "$GITHUB_STEP_SUMMARY"
            echo "Cloudflare Worker secret OPENAI_API_KEY is configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Premium English: safely disabled" >> "$GITHUB_STEP_SUMMARY"
            echo "The admin is deployed, but automatic translation remains disabled until OPENAI_API_KEY is added as a Worker or GitHub Actions secret." >> "$GITHUB_STEP_SUMMARY"
          fi
