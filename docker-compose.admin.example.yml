services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SITE_URL: https://probpera.ru
        NEXT_PUBLIC_ADMIN_URL: https://admin.probpera.ru
        ADMIN_BASE_PATH: /
        ADMIN_ALLOWED_ORIGINS: admin.probpera.ru,probpera.ru,www.probpera.ru
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_SITE_URL: https://probpera.ru
      NEXT_PUBLIC_ADMIN_URL: https://admin.probpera.ru
      ADMIN_BASE_PATH: /
      ADMIN_ALLOWED_ORIGINS: admin.probpera.ru,probpera.ru,www.probpera.ru
      PUBLIC_SITE_DEPLOY_HOOK_URL: ${PUBLIC_SITE_DEPLOY_HOOK_URL}
      PUBLIC_SITE_DEPLOY_HOOK_TOKEN: ${PUBLIC_SITE_DEPLOY_HOOK_TOKEN}
      GITHUB_DEPLOY_TOKEN: ${GITHUB_DEPLOY_TOKEN}
      GITHUB_DEPLOY_REPOSITORY: Kosyat128/probpera-literary-map
      GITHUB_DEPLOY_WORKFLOW: deploy-pages.yml
      GITHUB_DEPLOY_REF: main
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY}
      YANDEX_METRIKA_COUNTER_ID: ${YANDEX_METRIKA_COUNTER_ID}
    ports:
      - "127.0.0.1:3000:3000"
